<div class="full-width padding-10px border-box">
    <h4 class="flex center-center">Create Account</h4>
    <p class="no-margin text-center"><small>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Aut voluptatum repellat aliquam repreh</small></p>
    <div class="flex gap-1em column">
        <p>Name</p>
        <mat-form-field class="full-width">
            <mat-label>Name</mat-label>
            <input type="email" matInput placeholder="Joe Doe">
            <!-- <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
              Please enter a valid email address
            </mat-error>
            <mat-error *ngIf="emailFormControl.hasError('required')">
              Email is <strong>required</strong>
            </mat-error> -->
          </mat-form-field>
    </div>
    <div class="flex gap-1em column">
        <p>Email</p>
        <mat-form-field class="full-width">
            <mat-label>Email</mat-label>
            <input type="email" matInput placeholder="Ex. pat@example.com">
            <!-- <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
              Please enter a valid email address
            </mat-error>
            <mat-error *ngIf="emailFormControl.hasError('required')">
              Email is <strong>required</strong>
            </mat-error> -->
          </mat-form-field>
    </div>
    <div class="flex gap-1em column">
        <p>Create Password</p>
        <mat-form-field class="full-width">
            <mat-label>Create Password</mat-label>
            <input type="email" matInput placeholder="************">
            <!-- <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
              Please enter a valid email address
            </mat-error>
            <mat-error *ngIf="emailFormControl.hasError('required')">
              Email is <strong>required</strong>
            </mat-error> -->
          </mat-form-field>
    </div>
    <mat-checkbox class="example-margin">Agree to Terms and Conditions?</mat-checkbox>
    <div>
        <button class="full-width border-radius-20px" mat-raised-button color="primary">Submit</button>
    </div>
</div>
